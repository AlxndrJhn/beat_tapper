<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPM Tap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/rubberband-wasm@3.3.0/dist/index.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg-top: #112038;
      --bg-mid: #1f4c5e;
      --bg-bot: #efd9c1;
      --ink: #112038;
      --panel: rgba(255, 248, 239, 0.86);
      --accent: #f16a3a;
      --accent-2: #4ac0ad;
      --line: rgba(17, 32, 56, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Mono", monospace;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.35), transparent 45%),
        radial-gradient(circle at 90% 75%, rgba(255, 255, 255, 0.25), transparent 50%),
        linear-gradient(165deg, var(--bg-top), var(--bg-mid) 50%, var(--bg-bot));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(5px);
      overflow: hidden;
      animation: pop-in 0.55s ease-out;
    }

    .hero {
      padding: 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
    }

    .hero-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      font-family: "Syne", sans-serif;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
      font-size: clamp(1.7rem, 3.5vw, 2.65rem);
    }

    .hint {
      font-size: 0.88rem;
      opacity: 0.85;
    }

    .issue-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      background: rgba(17, 32, 56, 0.08);
      border: 1px solid var(--line);
      color: var(--ink);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .issue-link:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .section {
      padding: 20px 24px 24px;
      display: grid;
      gap: 14px;
    }

    .controls {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .chooser {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .track-chip,
    button {
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      background: rgba(255, 255, 255, 0.9);
      color: var(--ink);
    }

    .track-chip {
      max-width: min(62vw, 560px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      background: var(--accent);
      color: #fffdf9;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.95);
    }

    .bpm-box {
      text-align: right;
      min-width: 190px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px dashed var(--line);
      background: rgba(74, 192, 173, 0.12);
    }

    .bpm-value {
      font-family: "Syne", sans-serif;
      font-size: clamp(1.4rem, 4.5vw, 2.2rem);
      font-weight: 800;
      color: #0f5f55;
      line-height: 1;
    }

    .bpm-meta {
      font-size: 0.82rem;
      opacity: 0.85;
    }

    #wave {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
      padding: 8px;
    }

    .status {
      min-height: 1.1rem;
      font-size: 0.88rem;
      opacity: 0.9;
    }

    .section-divider {
      border-top: 1px solid var(--line);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .slider-row input[type="range"] {
      flex: 1 1 260px;
      accent-color: var(--accent);
    }

    .speed-value {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      color: #0f5f55;
      min-width: 4ch;
      text-align: right;
    }

    @keyframes pop-in {
      from {
        transform: translateY(10px) scale(0.98);
        opacity: 0;
      }

      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .bpm-box {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <header class="hero">
      <h1 class="title">Beat Tapper</h1>
      <div class="hint">Space: tap BPM | Auto-saves on 10 stable taps | 1-9: jump 10%-90%</div>
      <a class="issue-link" href="https://github.com/AlxndrJhn/beat_tapper/issues" target="_blank"
        rel="noreferrer">Report issues</a>
    </header>

    <section class="section">
      <div class="chooser">
        <span>Folder</span>
        <span id="folderLabel" class="track-chip">No folder selected</span>
        <button id="chooseFolderBtn" type="button">Choose Folder…</button>
        <input id="fileInput" type="file" multiple accept="audio/*" hidden />
      </div>
      <div>
        <span>Track</span>
        <span id="trackLabel" class="track-chip">Loading...</span>
      </div>
      <div class="controls">
        <div class="chooser">
          <button id="playBtn" type="button">Play / Pause</button>
          <button id="saveBtn" type="button">Save BPM</button>
          <button id="downloadBtn" type="button">Download results</button>
          <button id="nextBtn" type="button">Next File</button>
          <button id="prevBtn" type="button">Previous File</button>
        </div>

        <aside class="bpm-box">
          <div class="bpm-value" id="bpmValue">---</div>
          <div class="bpm-meta">Tap with Space to detect BPM</div>
        </aside>
      </div>

      <div id="wave"></div>
      <div class="status" id="status">Load a track to begin.</div>
    </section>

    <section class="section section-divider">
      <h2 class="title" style="font-size: 1.3rem;">Speed Up Songs</h2>
      <div class="slider-row">
        <label for="speedSlider">Target tempo</label>
        <input id="speedSlider" type="range" min="150" max="220" step="2.5" value="170" />
        <span class="speed-value" id="speedValue">170.0</span>
        <span>BPM</span>
      </div>
      <div class="chooser">
        <button id="speedUpBtn" type="button">Download sped up songs</button>
        <button id="cancelSpeedBtn" type="button" hidden>Cancel processing</button>
      </div>
      <div class="status" id="speedStatus">Tap and save BPMs above, then pick a target tempo.</div>
    </section>
  </main>

  <script>
    const trackLabel = document.getElementById("trackLabel");
    const folderLabel = document.getElementById("folderLabel");
    const chooseFolderBtn = document.getElementById("chooseFolderBtn");
    const fileInput = document.getElementById("fileInput");
    const playBtn = document.getElementById("playBtn");
    const saveBtn = document.getElementById("saveBtn");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    const bpmValue = document.getElementById("bpmValue");
    const statusEl = document.getElementById("status");
    const speedSlider = document.getElementById("speedSlider");
    const speedValue = document.getElementById("speedValue");
    const speedUpBtn = document.getElementById("speedUpBtn");
    const cancelSpeedBtn = document.getElementById("cancelSpeedBtn");
    const speedStatus = document.getElementById("speedStatus");

    const AUDIO_EXTENSIONS = new Set(["mp3", "opus", "m4a", "wav", "flac", "ogg"]);
    const HANDLE_DB = "bpmTool";
    const HANDLE_STORE = "handles";
    const HANDLE_KEY = "folder";
    const RESULTS_STORE = "results";
    const RESULTS_KEY = "bpm";

    let rootLabel = null;
    let tracks = [];
    let results = {};
    let currentIndex = 0;
    let currentBpm = null;
    let lastTapCount = 0;
    let tapTimes = [];
    let isAutoSaving = false;
    let currentObjectUrl = null;
    let isProcessing = false;
    let cancelRequested = false;
    let activeProcessingWorkers = [];

    class ProcessingCancelledError extends Error { }

    function setUiBusy(busy) {
      isProcessing = busy;
      [playBtn, saveBtn, nextBtn, prevBtn, chooseFolderBtn, speedUpBtn, speedSlider].forEach((el) => {
        el.disabled = busy;
      });
      cancelSpeedBtn.hidden = !busy;
    }

    function openHandleDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(HANDLE_DB, 2);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(HANDLE_STORE)) {
            request.result.createObjectStore(HANDLE_STORE);
          }
          if (!request.result.objectStoreNames.contains(RESULTS_STORE)) {
            request.result.createObjectStore(RESULTS_STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function idbGet(key, storeName = HANDLE_STORE) {
      const db = await openHandleDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const request = tx.objectStore(storeName).get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    async function idbSet(key, value, storeName = HANDLE_STORE) {
      const db = await openHandleDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function isAudioFile(name) {
      const ext = name.split(".").pop().toLowerCase();
      return AUDIO_EXTENSIONS.has(ext);
    }

    function trackKey(track) {
      return `${rootLabel}/${track.relPath}`;
    }

    const waveSurfer = WaveSurfer.create({
      container: "#wave",
      waveColor: "#4ac0ad",
      progressColor: "#f16a3a",
      cursorColor: "#112038",
      cursorWidth: 2,
      height: 150,
      normalize: true,
      barWidth: 2,
      barGap: 1,
      barRadius: 2,
    });

    function setStatus(text) {
      statusEl.textContent = text;
    }

    async function startPlaybackForCurrentTrack() {
      const track = getCurrentTrack();
      if (!track || !waveSurfer.getDuration()) {
        return;
      }

      try {
        await waveSurfer.play();
        setStatus(`Playing: ${track.relPath} (${currentIndex + 1}/${tracks.length})`);
      } catch (error) {
        setStatus(`Loaded: ${track.relPath}. Press Play if autoplay was blocked.`);
      }
    }

    async function fetchResults() {
      const saved = await idbGet(RESULTS_KEY, RESULTS_STORE);
      return saved && typeof saved === "object" ? saved : {};
    }

    async function collectTracksFromDirectory(dirHandle, prefix) {
      const found = [];
      for await (const [name, handle] of dirHandle.entries()) {
        const relPath = prefix ? `${prefix}/${name}` : name;
        if (handle.kind === "directory") {
          found.push(...(await collectTracksFromDirectory(handle, relPath)));
        } else if (isAudioFile(name)) {
          found.push({ name, relPath, getFile: () => handle.getFile() });
        }
      }
      return found;
    }

    function collectTracksFromFileList(fileList) {
      return Array.from(fileList)
        .filter((file) => isAudioFile(file.name))
        .map((file) => ({
          name: file.name,
          relPath: file.webkitRelativePath || file.name,
          getFile: () => Promise.resolve(file),
        }));
    }

    async function scanAndLoad(newTracks) {
      setStatus("Scanning folder...");
      folderLabel.textContent = rootLabel;
      results = await fetchResults();
      tracks = newTracks.sort((left, right) =>
        left.relPath.toLowerCase().localeCompare(right.relPath.toLowerCase()),
      );

      if (!tracks.length) {
        trackLabel.textContent = "No files found";
        setStatus("No audio tracks found in the selected folder.");
        return;
      }

      const firstUntagged = tracks.findIndex((track) => !(trackKey(track) in results));
      currentIndex = Math.max(0, firstUntagged === -1 ? 0 : firstUntagged);
      await loadCurrentTrack();
    }

    function getCurrentTrack() {
      return tracks[currentIndex] || null;
    }

    function updateBpmDisplayForCurrentTrack() {
      const track = getCurrentTrack();
      if (!track) {
        bpmValue.textContent = "---";
        return;
      }

      const saved = results[trackKey(track)];
      if (saved && typeof saved.bpm === "number") {
        bpmValue.textContent = saved.bpm.toFixed(1);
      } else {
        bpmValue.textContent = "---";
      }
    }

    async function loadCurrentTrack() {
      const track = getCurrentTrack();
      if (!track) {
        setStatus("No track selected.");
        return;
      }

      isAutoSaving = false;
      trackLabel.textContent = track.relPath;
      currentBpm = null;
      lastTapCount = 0;
      tapTimes = [];
      updateBpmDisplayForCurrentTrack();

      setStatus(`Loading ${track.relPath}...`);
      const file = await track.getFile();
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }
      currentObjectUrl = URL.createObjectURL(file);
      await waveSurfer.load(currentObjectUrl);
      await startPlaybackForCurrentTrack();
    }

    async function registerTap() {
      if (isAutoSaving || isProcessing) {
        return;
      }

      const now = performance.now();

      if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2500) {
        tapTimes = [];
      }

      tapTimes.push(now);
      if (tapTimes.length > 10) {
        tapTimes.shift();
      }

      if (tapTimes.length < 2) {
        return;
      }

      const intervals = [];
      for (let i = 1; i < tapTimes.length; i += 1) {
        intervals.push(tapTimes[i] - tapTimes[i - 1]);
      }

      const avgIntervalMs = intervals.reduce((a, b) => a + b, 0) / intervals.length;
      const bpm = 60000 / avgIntervalMs;
      const minIntervalMs = Math.min(...intervals);
      const maxIntervalMs = Math.max(...intervals);

      currentBpm = bpm;
      lastTapCount = intervals.length + 1;
      bpmValue.textContent = bpm.toFixed(1);

      if (tapTimes.length < 10) {
        return;
      }

      if (maxIntervalMs < 1.1 * avgIntervalMs && minIntervalMs > 0.9 * avgIntervalMs) {
        isAutoSaving = true;
        setStatus(`Stable 10-tap window detected for ${getCurrentTrack()?.relPath}. Saving...`);

        const saved = await saveCurrentBpm();
        if (saved) {
          await goToNextTrack();
        }
        isAutoSaving = false;
      }
    }

    async function saveCurrentBpm() {
      const track = getCurrentTrack();
      if (!track) {
        setStatus("No track selected.");
        return false;
      }
      if (typeof currentBpm !== "number") {
        setStatus("Tap a BPM first before saving.");
        return false;
      }

      const key = trackKey(track);
      results[key] = {
        bpm: Number(currentBpm.toFixed(2)),
      };
      try {
        await idbSet(RESULTS_KEY, results, RESULTS_STORE);
      } catch {
        setStatus("Could not save BPM.");
        return false;
      }
      updateBpmDisplayForCurrentTrack();
      setStatus(`Saved BPM ${currentBpm.toFixed(1)} for ${track.relPath}`);
      return true;
    }

    function downloadResults() {
      const blob = new Blob([`${JSON.stringify(results, null, 2)}\n`], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "bpm_results.json";
      link.click();
      URL.revokeObjectURL(url);
      setStatus(`Downloaded ${Object.keys(results).length} BPM result(s).`);
    }

    const HALF_TARGET_TOLERANCE_BPM = 5.0;
    let decodeAudioCtx = null;

    function getDecodeAudioContext() {
      if (!decodeAudioCtx) {
        decodeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return decodeAudioCtx;
    }

    // Mirrors main.py: snap to half-tempo when the source is already ~half the target.
    function computeTimeRatio(sourceBpm, targetBpm) {
      const halfTarget = targetBpm / 2;
      const effectiveBpm =
        Math.abs(sourceBpm - halfTarget) <= HALF_TARGET_TOLERANCE_BPM ? halfTarget : sourceBpm;
      return effectiveBpm / targetBpm;
    }

    const PROCESSING_WORKER_SOURCE = String.raw`
      importScripts(
        "https://cdn.jsdelivr.net/npm/rubberband-wasm@3.3.0/dist/index.umd.min.js",
        "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js",
      );

      const rubberbandBase = "https://cdn.jsdelivr.net/npm/rubberband-wasm@3.3.0/dist";
      let rubberbandApiPromise;
      let cancelled = false;

      class ProcessingCancelledError extends Error {}

      function loadRubberbandApi() {
        if (!rubberbandApiPromise) {
          rubberbandApiPromise = (async () => {
            const wasmModule = await WebAssembly.compileStreaming(fetch(rubberbandBase + "/rubberband.wasm"));
            return self.rubberband.RubberBandInterface.initialize(wasmModule);
          })();
        }
        return rubberbandApiPromise;
      }

      async function runRubberband(rbApi, channelBuffers, sampleRate, timeRatio) {
        const inputLength = channelBuffers[0].length;
        const outputCapacity = Math.ceil(inputLength * timeRatio * 1.05) + 8192;
        const outputBuffers = channelBuffers.map(() => new Float32Array(outputCapacity));
        const state = rbApi.rubberband_new(sampleRate, channelBuffers.length, 0, 1, 1);
        rbApi.rubberband_set_pitch_scale(state, 1);
        rbApi.rubberband_set_time_ratio(state, timeRatio);
        const samplesRequired = rbApi.rubberband_get_samples_required(state);
        rbApi.rubberband_set_expected_input_duration(state, inputLength);
        const channelArrayPtr = rbApi.malloc(channelBuffers.length * 4);
        const channelDataPtr = [];

        for (let channel = 0; channel < channelBuffers.length; channel += 1) {
          const bufferPtr = rbApi.malloc(samplesRequired * 4);
          channelDataPtr.push(bufferPtr);
          rbApi.memWritePtr(channelArrayPtr + channel * 4, bufferPtr);
        }

        const feedChunks = async (processChunk) => {
          let read = 0;
          let chunkCount = 0;
          while (read < inputLength) {
            if (cancelled) throw new ProcessingCancelledError();
            channelBuffers.forEach((buffer, index) =>
              rbApi.memWrite(channelDataPtr[index], buffer.subarray(read, read + samplesRequired)),
            );
            const remaining = Math.min(samplesRequired, inputLength - read);
            read += remaining;
            processChunk(remaining, read >= inputLength ? 1 : 0);
            chunkCount += 1;
            if (chunkCount % 8 === 0) await new Promise((resolve) => setTimeout(resolve, 0));
          }
        };

        let write = 0;
        const retrieve = (final) => {
          for (;;) {
            const available = rbApi.rubberband_available(state);
            if (available < 1 || (!final && available < samplesRequired)) break;
            const received = rbApi.rubberband_retrieve(state, channelArrayPtr, Math.min(samplesRequired, available));
            channelDataPtr.forEach((ptr, index) => outputBuffers[index].set(rbApi.memReadF32(ptr, received), write));
            write += received;
          }
        };

        try {
          await feedChunks((remaining, final) => rbApi.rubberband_study(state, channelArrayPtr, remaining, final));
          await feedChunks((remaining, final) => {
            rbApi.rubberband_process(state, channelArrayPtr, remaining, final);
            retrieve(false);
          });
          retrieve(true);
          return outputBuffers.map((buffer) => buffer.subarray(0, write));
        } finally {
          channelDataPtr.forEach((ptr) => rbApi.free(ptr));
          rbApi.free(channelArrayPtr);
          rbApi.rubberband_delete(state);
        }
      }

      async function encodeMp3(sampleRate, channelBuffers) {
        const channelCount = Math.min(channelBuffers.length, 2);
        const encoder = new lamejs.Mp3Encoder(channelCount, sampleRate, 192);
        const samplesPerFrame = 1152;
        const chunks = [];

        for (let offset = 0; offset < channelBuffers[0].length; offset += samplesPerFrame) {
          if (cancelled) throw new ProcessingCancelledError();
          const left = new Int16Array(samplesPerFrame);
          const right = channelCount === 2 ? new Int16Array(samplesPerFrame) : left;
          const frameLength = Math.min(samplesPerFrame, channelBuffers[0].length - offset);
          for (let index = 0; index < frameLength; index += 1) {
            const leftSample = Math.max(-1, Math.min(1, channelBuffers[0][offset + index]));
            left[index] = leftSample < 0 ? leftSample * 0x8000 : leftSample * 0x7fff;
            if (channelCount === 2) {
              const rightSample = Math.max(-1, Math.min(1, channelBuffers[1][offset + index]));
              right[index] = rightSample < 0 ? rightSample * 0x8000 : rightSample * 0x7fff;
            }
          }
          const encoded = channelCount === 2 ? encoder.encodeBuffer(left, right) : encoder.encodeBuffer(left);
          if (encoded.length) chunks.push(encoded);
          if ((offset / samplesPerFrame) % 200 === 0) await new Promise((resolve) => setTimeout(resolve, 0));
        }

        const finalChunk = encoder.flush();
        if (finalChunk.length) chunks.push(finalChunk);
        const length = chunks.reduce((total, chunk) => total + chunk.length, 0);
        const output = new Uint8Array(length);
        let offset = 0;
        chunks.forEach((chunk) => {
          output.set(chunk, offset);
          offset += chunk.length;
        });
        return output.buffer;
      }

      self.onmessage = async ({ data }) => {
        if (data.type === "cancel") {
          cancelled = true;
          return;
        }
        if (data.type !== "process") return;

        cancelled = false;
        try {
          const channels = data.channelBuffers.map((buffer) => new Float32Array(buffer));
          const stretched = await runRubberband(
            await loadRubberbandApi(), channels, data.sampleRate, data.timeRatio,
          );
          const mp3Buffer = await encodeMp3(data.sampleRate, stretched);
          self.postMessage({ type: "complete", mp3Buffer }, [mp3Buffer]);
        } catch (error) {
          self.postMessage({
            type: error instanceof ProcessingCancelledError ? "cancelled" : "error",
            message: error.message || String(error),
          });
        }
      };
    `;

    function createProcessingWorker() {
      const sourceUrl = URL.createObjectURL(new Blob([PROCESSING_WORKER_SOURCE], { type: "text/javascript" }));
      return { worker: new Worker(sourceUrl), sourceUrl };
    }

    function processAudioInWorker(worker, audioBuffer, timeRatio) {
      const channelBuffers = [];
      for (let channel = 0; channel < audioBuffer.numberOfChannels; channel += 1) {
        channelBuffers.push(new Float32Array(audioBuffer.getChannelData(channel)).buffer);
      }

      return new Promise((resolve, reject) => {
        const onMessage = ({ data }) => {
          if (data.type === "complete") {
            cleanup();
            resolve(new Blob([data.mp3Buffer], { type: "audio/mpeg" }));
          } else if (data.type === "cancelled") {
            cleanup();
            reject(new ProcessingCancelledError());
          } else if (data.type === "error") {
            cleanup();
            reject(new Error(data.message));
          }
        };
        const onError = (event) => {
          cleanup();
          reject(new Error(event.message || "Audio processing worker failed."));
        };
        const cleanup = () => {
          worker.removeEventListener("message", onMessage);
          worker.removeEventListener("error", onError);
        };

        worker.addEventListener("message", onMessage);
        worker.addEventListener("error", onError);
        worker.postMessage({
          type: "process",
          channelBuffers,
          sampleRate: audioBuffer.sampleRate,
          timeRatio,
        }, channelBuffers);
      });
    }

    function sanitizeFileName(name) {
      return name.replace(/[\\/:*?"<>|]+/g, "_");
    }

    async function downloadSpedUpSongs() {
      const eligible = tracks.filter((track) => {
        const saved = results[trackKey(track)];
        return saved && typeof saved.bpm === "number";
      });

      if (!eligible.length) {
        speedStatus.textContent = "Tap and save a BPM for at least one track first.";
        return;
      }

      const targetBpm = Number(speedSlider.value);
      cancelRequested = false;
      waveSurfer.pause();
      setUiBusy(true);

      const workerCount = Math.min(Math.min(4, Math.max(1, navigator.hardwareConcurrency || 1)), eligible.length);
      const workerResources = Array.from({ length: workerCount }, createProcessingWorker);
      activeProcessingWorkers = workerResources.map(({ worker }) => worker);

      try {
        speedStatus.textContent = `Starting ${workerCount} audio processing worker(s)...`;
        const processedTracks = new Array(eligible.length);
        let nextIndex = 0;
        let completedCount = 0;

        const processNextTrack = async ({ worker }) => {
          while (true) {
            if (cancelRequested) {
              throw new ProcessingCancelledError();
            }

            const index = nextIndex;
            nextIndex += 1;
            if (index >= eligible.length) {
              return;
            }

            const track = eligible[index];
            const sourceBpm = results[trackKey(track)].bpm;
            speedStatus.textContent = `Processing ${completedCount + 1}/${eligible.length}: ${track.relPath}`;

            const file = await track.getFile();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await getDecodeAudioContext().decodeAudioData(arrayBuffer);
            if (cancelRequested) {
              throw new ProcessingCancelledError();
            }

            const mp3Blob = await processAudioInWorker(
              worker,
              audioBuffer,
              computeTimeRatio(sourceBpm, targetBpm),
            );
            processedTracks[index] = { track, mp3Blob };
            completedCount += 1;
          }
        };

        await Promise.all(workerResources.map(processNextTrack));
        if (cancelRequested) {
          throw new ProcessingCancelledError();
        }

        speedStatus.textContent = "Zipping files...";
        const zip = new JSZip();
        processedTracks.forEach(({ track, mp3Blob }) => {
          const baseName = sanitizeFileName(track.name.replace(/\.[^./]+$/, ""));
          zip.file(`${baseName}_${targetBpm}bpm.mp3`, mp3Blob);
        });
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(zipBlob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `sped_up_${targetBpm}bpm.zip`;
        link.click();
        URL.revokeObjectURL(url);

        speedStatus.textContent = `Done. Downloaded ${eligible.length} sped-up track(s) at ${targetBpm} BPM.`;
      } catch (error) {
        if (error instanceof ProcessingCancelledError) {
          speedStatus.textContent = "Processing cancelled.";
        } else {
          speedStatus.textContent = `Error: ${error.message}`;
        }
      } finally {
        cancelRequested = false;
        activeProcessingWorkers.forEach((worker) => worker.postMessage({ type: "cancel" }));
        workerResources.forEach(({ worker, sourceUrl }) => {
          worker.terminate();
          URL.revokeObjectURL(sourceUrl);
        });
        activeProcessingWorkers = [];
        setUiBusy(false);
      }
    }

    async function goToNextTrack() {
      if (!tracks.length) {
        return;
      }
      if (currentIndex >= tracks.length - 1) {
        setStatus("Reached last file.");
        return;
      }
      currentIndex += 1;
      await loadCurrentTrack();
    }

    function seekPercent(percent) {
      if (!waveSurfer.getDuration()) {
        setStatus("Load an audio file before seeking.");
        return;
      }
      const progress = Math.max(0, Math.min(1, percent / 100));
      waveSurfer.seekTo(progress);
      setStatus(`Jumped to ${percent}%`);
    }

    async function chooseFolder() {
      if (window.showDirectoryPicker) {
        try {
          const directoryHandle = await window.showDirectoryPicker();
          rootLabel = directoryHandle.name;
          await idbSet(HANDLE_KEY, { type: "directory", handle: directoryHandle });
          await scanAndLoad(await collectTracksFromDirectory(directoryHandle, ""));
        } catch (error) {
          if (error.name !== "AbortError") {
            setStatus(`Could not open folder: ${error.message}`);
          }
        }
        return;
      }

      // Firefox has no folder picker; fall back to a plain multi-file picker.
      fileInput.click();
    }

    fileInput.addEventListener("change", async () => {
      if (!fileInput.files.length) {
        return;
      }
      rootLabel = "Selected Files";
      const files = Array.from(fileInput.files);
      await idbSet(HANDLE_KEY, { type: "files", files });
      await scanAndLoad(collectTracksFromFileList(files));
      fileInput.value = "";
    });

    async function init() {
      chooseFolderBtn.addEventListener("click", chooseFolder);

      const saved = await idbGet(HANDLE_KEY);
      if (!saved) {
        setStatus("Click \"Choose Folder…\" to select audio files.");
        return;
      }

      if (saved.type === "files") {
        rootLabel = "Selected Files";
        await scanAndLoad(collectTracksFromFileList(saved.files));
        return;
      }

      const directoryHandle = saved.handle;
      rootLabel = directoryHandle.name;
      const permission = await directoryHandle.queryPermission({ mode: "read" });
      if (permission === "granted") {
        await scanAndLoad(await collectTracksFromDirectory(directoryHandle, ""));
        return;
      }

      folderLabel.textContent = rootLabel;
      setStatus('Click "Choose Folder…" to re-grant access to the previously selected folder.');
    }

    playBtn.addEventListener("click", () => {
      if (!waveSurfer.getDuration()) {
        setStatus("Load an audio file before playing.");
        return;
      }
      waveSurfer.playPause();
    });

    saveBtn.addEventListener("click", async () => {
      await saveCurrentBpm();
    });

    document.getElementById("downloadBtn").addEventListener("click", downloadResults);

    speedSlider.addEventListener("input", () => {
      speedValue.textContent = Number(speedSlider.value).toFixed(1);
    });

    speedUpBtn.addEventListener("click", () => {
      void downloadSpedUpSongs();
    });

    cancelSpeedBtn.addEventListener("click", () => {
      cancelRequested = true;
      activeProcessingWorkers.forEach((worker) => worker.postMessage({ type: "cancel" }));
      speedStatus.textContent = "Cancelling...";
    });

    nextBtn.addEventListener("click", async () => {
      await goToNextTrack();
    });
    prevBtn.addEventListener("click", async () => {
      if (!tracks.length) {
        return;
      }
      if (currentIndex <= 0) {
        setStatus("Reached first file.");
        return;
      }
      currentIndex -= 1;
      await loadCurrentTrack();
    });

    document.addEventListener("keydown", (event) => {
      if (event.repeat || isProcessing) {
        return;
      }

      if (event.code === "Space") {
        event.preventDefault();
        void registerTap();
        return;
      }

      if (/^Digit[1-9]$/.test(event.code)) {
        const digit = Number(event.code.replace("Digit", ""));
        const percent = digit * 10;
        seekPercent(percent);
      }
    });

    waveSurfer.on("finish", () => setStatus("Playback finished."));
    waveSurfer.on("error", (error) => setStatus(`Audio error: ${error}`));

    init();
  </script>
</body>

</html>
